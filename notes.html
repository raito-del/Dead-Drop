<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead-Drop | Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix"></canvas>

  <main class="wrap">
    <!-- লগইন না থাকলে notes.js এটা দেখাবেই না -->
    <div id="content" class="hidden">

      <div class="topbar">
        <h2>root@dead-drop:~/notes$</h2>
        <div class="row" style="margin-top:0">
          <button class="btn" id="admin-toggle">Admin</button>
          <button class="btn" id="logout">Logout</button>
        </div>
      </div>

      <div class="terminal">
        <input type="search" id="search" placeholder="search notes...">
        <div class="hint" id="status"></div>
        <div class="list" id="list"></div>
      </div>

      <!-- Admin লগইন বক্স: Admin বাটনে চাপলে আসবে -->
      <form id="admin-login" class="admin-panel hidden" autocomplete="off">
        <h2>admin access</h2>
        <div class="row">
          <input type="password" id="admin-pw" placeholder="admin password" required>
          <button type="submit" class="btn">Login</button>
        </div>
        <div class="error" id="admin-msg"></div>
      </form>

      <!-- Upload প্যানেল: শুধু admin লগইন করলে দেখা যাবে -->
      <div id="admin-panel" class="admin-panel hidden">
        <h2>admin: upload pdf</h2>
        <div class="hint">GitHub-এর পেজে PDF ড্র্যাগ করে ফেলো, তারপর Commit changes চাপো।</div>
        <div class="row">
          <button class="btn" id="upload-btn">Open GitHub Upload</button>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    Made by Team <b>BreakByte</b>
  </footer>

  <script type="module" src="matrix.js"></script>
  <script type="module" src="notes.js"></script>
  <script type="module">
    import { loginAdmin, errorText } from "./auth.js";

    const toggle = document.getElementById("admin-toggle");
    const form = document.getElementById("admin-login");
    const pw = document.getElementById("admin-pw");
    const msg = document.getElementById("admin-msg");

    toggle.addEventListener("click", () => form.classList.toggle("hidden"));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      try {
        await loginAdmin(pw.value);
        // সফল হলে notes.js নিজে থেকেই Upload প্যানেল দেখাবে
        pw.value = "";
        form.classList.add("hidden");
      } catch (err) {
        msg.textContent = errorText(err);
      }
    });
  </script>
</body>
</html>
